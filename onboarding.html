<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e15">
<meta name="color-scheme" content="dark">
<title>StudyArc - Welcome</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div style="text-align:center;padding:28px 4px 8px;">
  <h1 style="font-size:24px;margin-bottom:10px;">Welcome to StudyArc</h1>
  <p>Study smarter. Stay focused. Achieve more.</p>
</div>

<div class="card" style="display:flex;align-items:center;gap:14px;">
  <div class="achievement-icon unlocked" style="color:var(--blue);background:rgba(96,165,250,.14);">
    <span class="material-symbols-rounded" aria-hidden="true">timer</span>
  </div>
  <div>
    <h2 style="margin-bottom:4px;">Focus Timer</h2>
    <p>Stay productive with distraction-free study sessions.</p>
  </div>
</div>

<div class="card" style="display:flex;align-items:center;gap:14px;">
  <div class="achievement-icon unlocked" style="color:var(--purple);background:rgba(167,139,250,.14);">
    <span class="material-symbols-rounded" aria-hidden="true">groups</span>
  </div>
  <div>
    <h2 style="margin-bottom:4px;">Study Rooms</h2>
    <p>Study together with friends and classmates.</p>
  </div>
</div>

<div class="card" style="display:flex;align-items:center;gap:14px;">
  <div class="achievement-icon unlocked" style="color:var(--orange);background:rgba(251,146,60,.14);">
    <span class="material-symbols-rounded" aria-hidden="true">bar_chart</span>
  </div>
  <div>
    <h2 style="margin-bottom:4px;">Track Progress</h2>
    <p>See your streaks, statistics and daily goals.</p>
  </div>
</div>

<button class="button" style="margin-top:8px;" onclick="location.href='login.html'">Get Started</button>

</body>
</html>
