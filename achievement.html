<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e15">
<meta name="color-scheme" content="dark">
<title>StudyArc - Achievements</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<script src="js/app.js" defer></script>
</head>

<body>

<div class="header-row">
  <h1>🏆 Achievements</h1>
</div>

<div class="card">
  <div class="achievement-row">
    <div class="achievement-icon">🥇</div>
    <div class="achievement-body">
      <h3>First Focus Session</h3>
      <p id="badge1">🔒 Locked</p>
    </div>
  </div>
  <div class="achievement-row">
    <div class="achievement-icon">🔥</div>
    <div class="achievement-body">
      <h3>7 Day Streak</h3>
      <p id="badge2">🔒 Locked</p>
    </div>
  </div>
  <div class="achievement-row">
    <div class="achievement-icon">🎓</div>
    <div class="achievement-body">
      <h3>Reach Level 10</h3>
      <p id="badge3">🔒 Locked</p>
    </div>
  </div>
</div>

<div class="nav">
  <a href="home.html">
    <span class="material-symbols-rounded" aria-hidden="true">home</span>
    <span>Home</span>
  </a>
  <a href="focus.html">
    <span class="material-symbols-rounded" aria-hidden="true">timer</span>
    <span>Focus</span>
  </a>
  <a href="todo.html">
    <span class="material-symbols-rounded" aria-hidden="true">check_circle</span>
    <span>To-Do</span>
  </a>
  <a href="stats.html">
    <span class="material-symbols-rounded" aria-hidden="true">bar_chart</span>
    <span>Statistics</span>
  </a>
  <a href="profile.html">
    <span class="material-symbols-rounded" aria-hidden="true">person</span>
    <span>Profile</span>
  </a>
</div>

<script>
// Recolors each achievement icon once app.js resolves lock state
(function(){
  function sync(){
    ['badge1','badge2','badge3'].forEach(function(id){
      var el = document.getElementById(id);
      if(!el) return;
      var icon = el.closest('.achievement-row').querySelector('.achievement-icon');
      var unlocked = el.textContent.indexOf('🔒') === -1;
      icon.classList.toggle('unlocked', unlocked);
    });
  }
  new MutationObserver(sync).observe(document.body, { subtree:true, characterData:true, childList:true });
  sync();
})();
</script>

</body>
</html>
