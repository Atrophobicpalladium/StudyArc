<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e15">
<meta name="color-scheme" content="dark">
<title>StudyArc - Statistics</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>

<body>

<div class="header-row">
  <h1>📊 Statistics</h1>
</div>

<div class="card">
  <h2>Total Study Time</h2>
  <h1 id="totalStudy" style="font-size:28px;">0h 0m</h1>
  <p style="margin-top:6px;">Your total focus time.</p>
</div>

<div class="grid">
  <div class="stat">
    <h1 id="streak">🔥 0</h1>
    <p>Current Streak</p>
  </div>
  <a class="stat" href="xp.html">
    <h1 id="level">Level 1</h1>
    <p>Level</p>
  </a>
  <a class="stat" href="xp.html">
    <h1 id="xp">0 / 100 XP</h1>
    <p>Experience</p>
  </a>
  <div class="stat">
    <h1 id="goalTime">0h 0m / 6h</h1>
    <p>Daily Goal</p>
  </div>
</div>

<div class="card">
  <h2>🎯 Daily Goal</h2>
  <div class="progress">
    <div id="goalFill" class="fill"></div>
  </div>
  <p id="goalPercent">0% Completed</p>
</div>

<a class="card" href="achievement.html" style="display:block;">
  <h2>🏆 Achievements</h2>
  <p id="badge1" style="margin-bottom:6px;">🔒 Locked</p>
  <p id="badge2" style="margin-bottom:6px;">🔒 Locked</p>
  <p id="badge3">🔒 Locked</p>
</a>

<!-- Navigation -->
<div class="nav">
  <a href="home.html">
    <span class="material-symbols-rounded" aria-hidden="true">home</span>
    <span>Home</span>
  </a>
  <a href="focus.html">
    <span class="material-symbols-rounded" aria-hidden="true">timer</span>
    <span>Focus</span>
  </a>
  <a href="todo.html">
    <span class="material-symbols-rounded" aria-hidden="true">check_circle</span>
    <span>To-Do</span>
  </a>
  <a class="active" href="stats.html" aria-current="page">
    <span class="material-symbols-rounded" aria-hidden="true">bar_chart</span>
    <span>Statistics</span>
  </a>
  <a href="profile.html">
    <span class="material-symbols-rounded" aria-hidden="true">person</span>
    <span>Profile</span>
  </a>
</div>

</body>
</html>
