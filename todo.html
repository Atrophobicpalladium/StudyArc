<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e15">
<meta name="color-scheme" content="dark">
<title>StudyArc - To-Do</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<script src="js/app.js" defer></script>
</head>

<body>

<div class="header-row">
  <h1>✅ My Tasks</h1>
  <a class="icon-btn" href="calendar.html" aria-label="Calendar">
    <span class="material-symbols-rounded" aria-hidden="true">calendar_month</span>
  </a>
</div>

<div class="card">
  <div class="field-wrap" style="margin-bottom:14px;">
    <span class="material-symbols-rounded" aria-hidden="true">edit</span>
    <input id="taskInput" class="input" type="text" placeholder="Add a new task...">
  </div>
  <button class="button" onclick="addTask()">➕ Add Task</button>
</div>

<div class="card">
  <h2>📋 Task List</h2>
  <div id="taskList">
    <p>No tasks yet.</p>
  </div>
</div>

<div class="card">
  <h2>📊 Progress</h2>
  <div class="progress">
    <div class="fill" id="taskProgress"></div>
  </div>
  <p id="taskPercent">0% Completed</p>
</div>

<!-- Bottom Navigation -->
<div class="nav">
  <a href="home.html">
    <span class="material-symbols-rounded" aria-hidden="true">home</span>
    <span>Home</span>
  </a>
  <a href="focus.html">
    <span class="material-symbols-rounded" aria-hidden="true">timer</span>
    <span>Focus</span>
  </a>
  <a class="active" href="todo.html" aria-current="page">
    <span class="material-symbols-rounded" aria-hidden="true">check_circle</span>
    <span>To-Do</span>
  </a>
  <a href="stats.html">
    <span class="material-symbols-rounded" aria-hidden="true">bar_chart</span>
    <span>Statistics</span>
  </a>
  <a href="profile.html">
    <span class="material-symbols-rounded" aria-hidden="true">person</span>
    <span>Profile</span>
  </a>
</div>

</body>
</html>
