<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e15">
<meta name="color-scheme" content="dark">
<title>StudyArc - XP</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<script src="js/app.js" defer></script>
</head>

<body>

<div class="header-row">
  <h1>Level Progress</h1>
</div>

<div class="card" style="text-align:center;">
  <div class="avatar" style="margin:0 auto 14px;">⭐</div>
  <h1 id="level" style="font-size:22px;margin-bottom:6px;">Level 1</h1>
  <h2 id="xp" style="font-size:15px;color:var(--sub);font-weight:600;margin-bottom:16px;">0 / 100 XP</h2>
  <div class="progress">
    <div id="xpFill" class="fill"></div>
  </div>
</div>

<div class="card">
  <h2>Rewards</h2>
  <p style="margin-bottom:8px;">🥉 Level 5 — Bronze Scholar</p>
  <p style="margin-bottom:8px;">🥈 Level 10 — Silver Scholar</p>
  <p style="margin-bottom:8px;">🥇 Level 20 — Gold Scholar</p>
  <p>💎 Level 50 — Study Legend</p>
</div>

<div class="nav">
  <a href="home.html">
    <span class="material-symbols-rounded" aria-hidden="true">home</span>
    <span>Home</span>
  </a>
  <a href="focus.html">
    <span class="material-symbols-rounded" aria-hidden="true">timer</span>
    <span>Focus</span>
  </a>
  <a href="todo.html">
    <span class="material-symbols-rounded" aria-hidden="true">check_circle</span>
    <span>To-Do</span>
  </a>
  <a href="stats.html">
    <span class="material-symbols-rounded" aria-hidden="true">bar_chart</span>
    <span>Statistics</span>
  </a>
  <a href="profile.html">
    <span class="material-symbols-rounded" aria-hidden="true">person</span>
    <span>Profile</span>
  </a>
</div>

</body>
</html>
