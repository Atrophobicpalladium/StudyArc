<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e15">
<meta name="color-scheme" content="dark">
<title>StudyArc - Focus</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>

<body>

<div class="header-row">
  <h1>Timer</h1>
  <a class="icon-btn" href="settings.html" aria-label="Settings">
    <span class="material-symbols-rounded" aria-hidden="true">settings</span>
  </a>
</div>

<div class="timer-container">
  <svg class="timer-svg" viewBox="0 0 280 280">
    <defs>
      <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4ade80"/>
        <stop offset="100%" stop-color="#16a34a"/>
      </linearGradient>
    </defs>
    <circle class="timer-bg" cx="140" cy="140" r="115"></circle>
    <circle id="progressCircle" class="timer-progress" cx="140" cy="140" r="115"></circle>
  </svg>
  <div class="timer-content">
    <h1 id="timer">25:00</h1>
    <p>Stay Focused 🚀</p>
  </div>
</div>

<div class="timer-buttons">
  <button class="button" onclick="setTime(25)">25 Min</button>
  <button class="button" onclick="setTime(50)">50 Min</button>
  <button class="button" onclick="setTime(90)">90 Min</button>
</div>

<div class="control-buttons">
  <button class="button" onclick="startTimer()">▶ Start</button>
  <button class="button" onclick="pauseTimer()">⏸ Pause</button>
  <button class="button" onclick="resetTimer()">🔄 Reset</button>
</div>

<div class="card">
  <h2>Today's Progress</h2>
  <div class="progress">
    <div id="goalFill" class="fill"></div>
  </div>
  <p id="goalPercent">0% Completed</p>
</div>

<div class="nav">
  <a href="home.html">
    <span class="material-symbols-rounded" aria-hidden="true">home</span>
    <span>Home</span>
  </a>
  <a class="active" href="focus.html" aria-current="page">
    <span class="material-symbols-rounded" aria-hidden="true">timer</span>
    <span>Focus</span>
  </a>
  <a href="todo.html">
    <span class="material-symbols-rounded" aria-hidden="true">check_circle</span>
    <span>To-Do</span>
  </a>
  <a href="stats.html">
    <span class="material-symbols-rounded" aria-hidden="true">bar_chart</span>
    <span>Statistics</span>
  </a>
  <a href="profile.html">
    <span class="material-symbols-rounded" aria-hidden="true">person</span>
    <span>Profile</span>
  </a>
</div>

</body>
</html>
